<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You're offline — Webxpress Technologies</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        :root { --navy: #1B2D5F; --gray: #4A4A4A; --muted: #5B6270; --red: #C91527; }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100svh; display: flex; align-items: center; justify-content: center;
            padding: 2rem 1.5rem; background: #fff; color: var(--gray);
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-text-size-adjust: 100%;
        }
        .wrap { max-width: 34rem; text-align: center; }
        .accent { display: block; width: 3rem; height: 3px; margin: 0 auto 2rem; background: var(--red); }
        h1 {
            margin: 0 0 1rem; color: var(--navy);
            font-size: clamp(1.75rem, 6vw, 2.5rem); line-height: 1.15; letter-spacing: -0.02em;
        }
        p { margin: 0 0 2rem; color: var(--muted); font-size: 1.0625rem; line-height: 1.65; }
        a.btn {
            display: inline-block; min-height: 44px; padding: 0.75rem 1.5rem;
            border-radius: 9999px; background: var(--navy); color: #fff;
            font-size: 0.9375rem; font-weight: 600; text-decoration: none; white-space: nowrap;
        }
        a.btn:hover { background: var(--red); }
        a.btn:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
    </style>
</head>
<body>
    <div class="wrap">
        <span class="accent" aria-hidden="true"></span>
        <h1>You&rsquo;re offline</h1>
        <p>This page hasn&rsquo;t been saved to your device yet. Reconnect and try again.</p>
        <a class="btn" href="/">Back to home</a>
    </div>
</body>
</html>
